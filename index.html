<!-- page -->
<title>Vocab Flashcards</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout: set picker on top, one index card centered on a desk, tap to flip, counter beneath */
  :root {
    --desk: #2f4a5c;
    --desk-ink: #dfe8ee;
    --desk-muted: #9fb3c1;
    --desk-raised: #3b5a6e;
    --card: #fbfaf5;
    --card-ink: #1f2a33;
    --card-muted: #5d6b76;
    --rule: #b9d3e6;
    --margin: #d9534f;
    --accent: #8fc3ea;
    --display: "Young Serif", Georgia, "Times New Roman", serif;
    --body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --desk: #141d24; --desk-ink: #d5dee5; --desk-muted: #7f929f; --desk-raised: #1f2c36;
      --card: #e9e6dc; --card-ink: #1c252c; --card-muted: #55626c;
      --rule: #a8c0d2; --margin: #c4504c; --accent: #6fa8d6;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --desk: #141d24; --desk-ink: #d5dee5; --desk-muted: #7f929f; --desk-raised: #1f2c36;
    --card: #e9e6dc; --card-ink: #1c252c; --card-muted: #55626c;
    --rule: #a8c0d2; --margin: #c4504c; --accent: #6fa8d6;
    color-scheme: dark;
  }

  html, body { height: 100%; margin: 0; }
  body {
    background: var(--desk);
    color: var(--desk-ink);
    font-family: var(--body);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding-block: 16px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    box-sizing: border-box;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    -webkit-user-select: none;
  }

  .picker {
    width: min(100%, 440px);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .picker label {
    font-size: 0.75rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--desk-muted);
  }
  .picker select {
    flex: 1;
    min-width: 0;
    font: inherit;
    font-size: 1rem;
    color: var(--desk-ink);
    background: var(--desk-raised);
    border: 1px solid transparent;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .picker select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .scene {
    width: min(100%, 440px);
    aspect-ratio: 5 / 3.4;
    max-width: 100%;
    perspective: 1400px;
  }
  @media (max-width: 520px) and (orientation: portrait) {
    .scene { aspect-ratio: 3 / 4; max-height: 62vh; }
  }
  /* Older iOS (before 15) has no aspect-ratio; give the card a fixed height */
  @supports not (aspect-ratio: 1) {
    .scene { height: 300px; }
    @media (max-width: 520px) and (orientation: portrait) {
      .scene { height: 60vh; }
    }
  }

  /* A div, not a <button>: Safari flattens 3D transforms inside buttons */
  .card {
    display: block;
    position: relative;
    width: 100%;
    height: 100%;
    cursor: pointer;
    outline: none;
    -webkit-transform-style: preserve-3d;
    transform-style: preserve-3d;
    -webkit-transition: -webkit-transform 0.6s cubic-bezier(0.3, 0.7, 0.25, 1);
    transition: transform 0.6s cubic-bezier(0.3, 0.7, 0.25, 1);
    touch-action: manipulation;
  }
  .card.flipped { -webkit-transform: rotateY(180deg); transform: rotateY(180deg); }
  .card:focus-visible .face { outline: 3px solid var(--accent); outline-offset: 4px; }

  .face {
    position: absolute;
    top: 0; right: 0; bottom: 0; left: 0;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 6px;
    background: var(--card);
    color: var(--card-ink);
    box-shadow: 0 1px 2px rgba(0,0,0,.25), 0 14px 30px rgba(0,0,0,.28);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    overflow: hidden;
  }

  /* Front: plain card, word centered */
  .front {
    -webkit-transform: rotateY(0deg);
    transform: rotateY(0deg);
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  .word {
    font-family: var(--display);
    font-size: clamp(2rem, 9vw, 3rem);
    line-height: 1.1;
    overflow-wrap: anywhere;
    text-wrap: balance;
  }
  .hint {
    position: absolute;
    bottom: 16px;
    left: 0; right: 0;
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--card-muted);
  }

  /* Back: ruled index card, word above the red header line */
  .back {
    -webkit-transform: rotateY(180deg);
    transform: rotateY(180deg);
    padding: 18px 22px 22px;
    background-image:
      linear-gradient(var(--margin), var(--margin)),
      repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
    background-size: 100% 2px, 100% 100%;
    background-position: 0 58px, 0 58px;
    background-repeat: no-repeat, repeat;
    background-color: var(--card);
  }
  .back-word {
    font-family: var(--display);
    font-size: 1.35rem;
    min-height: 40px;
    overflow-wrap: anywhere;
  }
  .def {
    margin: 8px 0 0;
    font-size: clamp(1.15rem, 5vw, 1.35rem);
    line-height: 32px;
  }

  .status {
    font-size: 0.85rem;
    color: var(--desk-muted);
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce) {
    .card { -webkit-transition: none; transition: none; }
  }
</style>
<!-- /page -->
</head>
<body>
<!-- page -->
<div class="picker">
  <label for="set">Words</label>
  <select id="set"></select>
</div>
<div class="scene">
  <div class="card" id="card" role="button" tabindex="0" aria-live="polite" aria-label="Flashcard">
    <div class="face front">
      <div class="word" id="front-word">Loading…</div>
      <div class="hint">Tap to see definition</div>
    </div>
    <div class="face back">
      <div class="back-word" id="back-word"></div>
      <p class="def" id="def"></p>
    </div>
  </div>
</div>
<!-- Replaced by the script. If it stays, scripts aren't running (e.g. an iOS file preview). -->
<div class="status" id="status">No words? This preview can't run the flashcards. Open the page in Safari or Chrome.</div>

<!-- Show script errors on the page, since phones have no console -->
<script>
  window.onerror = function (msg, src, line) {
    document.getElementById("status").textContent = "Error: " + msg + " (line " + line + ")";
  };
</script>

  // Selector: "all" or the index of a day set. The chosen set repeats, reshuffled each pass.
  picker.options.add(new Option("All days (" + ALL.length + " words)", "all"));
  for (var d = 0; d < WORD_SETS.length; d++) {
    picker.options.add(new Option(WORD_SETS[d].name + " (" + WORD_SETS[d].words.length + ")", String(d)));
  }

  var words = ALL;
  var deck = [];
  var current = null;
  var shown = 0;
  var pass = 0;
  var flipped = false;
  var busy = false;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  // Draw without repeats until every word in the set has been seen, then start
  // a new pass. Avoid showing the same word twice in a row across passes.
  function nextWord() {
    if (deck.length === 0) {
      deck = shuffle(words.slice());
      var last = deck.length - 1;
      if (current && last > 0 && deck[last] === current) {
        deck[last] = deck[0]; deck[0] = current;
      }
      shown = 0;
      pass++;
    }
    shown++;
    return deck.pop();
  }

  function setFront(w) {
    $("front-word").textContent = w[0];
    $("status").textContent = "Pass " + pass + " \u00b7 " + shown + " of " + words.length;
  }
  function setBack(w) {
    $("back-word").textContent = w[0];
    $("def").textContent = w[1];
  }

  function startSet(value) {
    words = value === "all" || !WORD_SETS[value] ? ALL : WORD_SETS[value].words;
    deck = [];
    current = null;
    pass = 0;
    flipped = false;
    busy = false;
    card.className = "card";
    current = nextWord();
    setFront(current);
    setBack(current);
  }

  card.addEventListener("keydown", function (e) {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); card.click(); }
  });

  card.addEventListener("click", function () {
    if (busy) return;
    if (!flipped) {
      flipped = true;
      card.className = "card flipped";
      return;
    }
    // Flip back to the front with a new word. The front face is hidden while
    // flipped, so it can change now; the back keeps its text until it turns away.
    var w = nextWord();
    current = w;
    setFront(w);
    flipped = false;
    busy = true;
    card.className = "card";
    var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
    setTimeout(function () { setBack(w); busy = false; }, reduce ? 0 : 600);
  });

  picker.addEventListener("change", function () {
    try { localStorage.setItem("vocab-set", picker.value); } catch (e) {}
    startSet(picker.value);
    picker.blur();
  });

  var saved = "all";
  try { saved = localStorage.getItem("vocab-set") || "all"; } catch (e) {}
  if (saved !== "all" && !WORD_SETS[saved]) saved = "all";
  picker.value = saved;
  startSet(saved);
</script>
<!-- /page -->
</body>
</html>
